  fill_from: extract
  section: What is n8n used for? (best use cases)
  custom_input: 'I had a extreme wide range of tasks...


    Backing up configs of various stuff via api


    Posting to my social media accounts


    Making generic reply/joke bots


    It was kinda easier to run api requests and just test stuff this way imo


    I even used it update my docs site to pull the latest softwares i was running on my server in a neat
    display.


    I kinda stopped using it but i plan to run it again honestly... lots have changed since then.'
  source_urls:
