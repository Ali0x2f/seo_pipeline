  fill_from: extract
  section: What is n8n?
  custom_input: 'API connects apps and makes them talk to each other.


    n8n is a platform where you can take apps like instagram, ChatGPT, gmail, google sheets etc. And have
    them talk to each other and make them do things in sequence.


    Example: I set up a workflow automation that says:


    When my Gmail inbox gets an email, start this workflow -


    send that email to ChatGPT to analyze and make a response.


    Log that response in google sheets for record keeping


    Use the response created by ChatGPT and send a reply.'
  source_urls:
  - https://www.hostinger.com/tutorials/what-is-n8n/
